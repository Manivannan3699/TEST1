<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Transaction Entry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }
    input, select, button {
      padding: 8px;
      margin: 6px 0;
      width: 100%;
      box-sizing: border-box;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .actions button {
      flex: 1 1 150px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Transaction Entry</h2>
  <form id="transaction-form">
    <input type="date" id="date" name="date" required><br>
    <input type="text" id="branch" name="branch" placeholder="Branch Name" required><br>
    <input type="text" id="sm" name="sm" placeholder="SM Name" required><br>
    <input type="text" id="customer" name="customer" placeholder="Customer Name" required><br>
    <input type="number" id="transactionAmount" name="transactionAmount" placeholder="Transaction Amount" required><br>
    <input type="number" id="receivedAmount" name="receivedAmount" placeholder="Received Amount" required><br>
    <input type="number" id="differentAmount" name="differentAmount" placeholder="Different Amount" readonly><br>
    <input type="text" id="aadhar" name="aadhar" placeholder="Aadhar Number" required><br>
    <input type="text" id="pan" name="pan" placeholder="PAN Number" required><br>
    <button type="submit">Submit</button>
  </form>

  <hr>

  <h2>All Transactions</h2>
  <div class="actions">
    <button type="button" id="loadDataBtn">Load Data</button>
    <button type="button" id="exportExcelBtn">Download Excel</button>
    <button type="button" id="exportPDFBtn">Download PDF</button>
  </div>

  <table id="results-table" border="1">
    <thead>
      <tr>
        <th>Date</th>
        <th>Branch</th>
        <th>SM</th>
        <th>Customer</th>
        <th>Transaction</th>
        <th>Received</th>
        <th>Different</th>
        <th>Aadhar</th>
        <th>PAN</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
  const sheetURL = "https://script.google.com/macros/s/AKfycbxubwe244qheIRtU8x8ar65-kNAvTdf56Q64NEIUg4W6u9uzm3HKGljepOsU2axMR7NQg/exec";

  // Calculate difference live
  document.getElementById("transaction-form").addEventListener("input", () => {
    const txn = parseFloat(document.getElementById("transactionAmount").value) || 0;
    const rcv = parseFloat(document.getElementById("receivedAmount").value) || 0;
    document.getElementById("differentAmount").value = rcv - txn;
  });

  // Submit form data to Google Apps Script
  document.getElementById("transaction-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const data = Object.fromEntries(new FormData(form));

    try {
      const res = await fetch(sheetURL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(data),
        mode: "cors"
      });

      if (!res.ok) throw new Error("Network response was not ok");

      const result = await res.json();

      if (result.status === "success") {
        alert("Submitted successfully!");
        form.reset();
        document.getElementById("differentAmount").value = '';
        loadData();
      } else {
        alert("Error: " + result.message);
      }
    } catch (error) {
      alert("Fetch error: " + error.message);
      console.error("Fetch error details:", error);
    }
  });

  // Load data from sheet and populate table
  async function loadData() {
    try {
      const res = await fetch(sheetURL);
      if (!res.ok) throw new Error("Failed to fetch data");

      const data = await res.json();
      const tbody = document.querySelector("#results-table tbody");
      tbody.innerHTML = "";

      data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.date || ""}</td>
          <td>${row.branch || ""}</td>
          <td>${row.sm || ""}</td>
          <td>${row.customer || ""}</td>
          <td>${row.transactionamount || ""}</td>
          <td>${row.receivedamount || ""}</td>
          <td>${row.differentamount || ""}</td>
          <td>${row.aadhar || ""}</td>
          <td>${row.pan || ""}</td>
        `;
        tbody.appendChild(tr);
      });
    } catch (error) {
      alert("Error loading data: " + error.message);
      console.error("Load data error:", error);
    }
  }

  // Export table to Excel
  function exportExcel() {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.table_to_sheet(document.getElementById("results-table"));
    XLSX.utils.book_append_sheet(wb, ws, "Transactions");
    XLSX.writeFile(wb, "Transactions.xlsx");
  }

  // Export table to PDF
  async function exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text("Transaction Report", 14, 15);
    doc.autoTable({ html: "#results-table", startY: 20 });
    doc.save("Transactions.pdf");
  }

  // Event listeners for buttons
  document.getElementById("loadDataBtn").addEventListener("click", loadData);
  document.getElementById("exportExcelBtn").addEventListener("click", exportExcel);
  document.getElementById("exportPDFBtn").addEventListener("click", exportPDF);

  // Load data on page load
  window.onload = loadData;
</script>

</body>
</html>
