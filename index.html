<!DOCTYPE html>
<html>
<head>
  <title>Daily Transaction Tracker</title>
  <meta charset="UTF-8" />
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input, select { padding: 5px; margin: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    th { background-color: #f2f2f2; }
    button { margin: 5px; padding: 6px 12px; }
  </style>
</head>
<body>

  <h2>Daily Transaction Form</h2>
  <form id="transactionForm">
    <label>Date: <input type="date" name="Date" required></label>
    <label>Branch: <input type="text" name="Branch" required></label>
    <label>SM: <input type="text" name="SM" required></label>
    <label>Customer: <input type="text" name="Customer" required></label><br>
    <label>Transaction: <input type="number" name="Transaction" required></label>
    <label>Received: <input type="number" name="Received" required></label>
    <label>Aadhar: <input type="text" name="Aadhar"></label>
    <label>PAN: <input type="text" name="PAN"></label><br>
    <button type="submit">Submit</button>
  </form>

  <h2>Transaction Dashboard</h2>
  <label>Filter by Branch: <input type="text" id="filterBranch"></label>
  <label>Filter by SM: <input type="text" id="filterSM"></label>
  <label>Filter by Customer: <input type="text" id="filterCustomer"></label>
  <button onclick="filterData()">Filter</button>
  <button onclick="downloadExcel()">Download Excel</button>
  <button onclick="downloadPDF()">Download PDF</button>

  <table id="dataTable">
    <thead></thead>
    <tbody></tbody>
  </table>

<script>
  // Replace with your actual Apps Script web app URL
  const scriptURL = 'https://script.google.com/macros/s/AKfycby8pYT2nK7ircLawiZ1qR42rqHTZnrEUxFcv9F09kTRQqOh_7yatLGUA09zGlGE0uEiTA/exec';

  // Form submission
  document.getElementById('transactionForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const data = {};
    formData.forEach((value, key) => data[key] = value);

    fetch(scriptURL, {
      method: 'POST',
      body: JSON.stringify(data),
      headers: { 'Content-Type': 'application/json' }
    })
    .then(res => res.text())
    .then(res => {
      alert('Submitted successfully!');
      this.reset();
      loadData();
    })
    .catch(err => alert('Error: ' + err));
  });

  let allData = [];

  // Load data using JSONP
  function loadData() {
    const callbackName = 'jsonpCallback_' + Math.floor(Math.random() * 1000000);
    window[callbackName] = function(data) {
      allData = data;
      renderTable(data);
      delete window[callbackName];
      script.remove();
    };

    const script = document.createElement('script');
    script.src = `${scriptURL}?callback=${callbackName}`;
    document.body.appendChild(script);
  }

  function renderTable(data) {
    const thead = document.querySelector('#dataTable thead');
    const tbody = document.querySelector('#dataTable tbody');
    if (data.length === 0) {
      thead.innerHTML = '';
      tbody.innerHTML = '<tr><td colspan="9">No data</td></tr>';
      return;
    }

    thead.innerHTML = '<tr>' + Object.keys(data[0]).map(h => `<th>${h}</th>`).join('') + '</tr>';
    tbody.innerHTML = data.map(row => {
      return '<tr>' + Object.values(row).map(val => `<td>${val}</td>`).join('') + '</tr>';
    }).join('');
  }

  // Filtering
  function filterData() {
    const branch = document.getElementById('filterBranch').value.toLowerCase();
    const sm = document.getElementById('filterSM').value.toLowerCase();
    const customer = document.getElementById('filterCustomer').value.toLowerCase();

    const filtered = allData.filter(row =>
      row.Branch.toLowerCase().includes(branch) &&
      row.SM.toLowerCase().includes(sm) &&
      row.Customer.toLowerCase().includes(customer)
    );

    renderTable(filtered);
  }

  // Export to Excel
  function downloadExcel() {
    let table = document.getElementById('dataTable').outerHTML;
    let blob = new Blob(['\ufeff', table], { type: 'application/vnd.ms-excel' });
    let link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'transactions.xls';
    link.click();
  }

  // Export to PDF
  function downloadPDF() {
    const printWindow = window.open('', '', 'height=600,width=800');
    printWindow.document.write('<html><head><title>Transactions</title></head><body>');
    printWindow.document.write(document.getElementById('dataTable').outerHTML);
    printWindow.document.write('</body></html>');
    printWindow.document.close();
    printWindow.print();
  }

  // Load data on page load
  loadData();
</script>

</body>
</html>
